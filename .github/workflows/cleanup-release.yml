name: Cleanup Release Environment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (z.B. release/v1.1.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  # Node 20 action runtime is deprecated (GitHub forces Node 24 from 2026-06-16).
  # Opt in now for actions without a Node 24 release yet (aws-actions/*); remove once they ship one.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cleanup:
    name: Delete Release Stack
    runs-on: ubuntu-latest

    steps:
      - name: Derive stack name
        id: env
        env:
          # Pass the untrusted input via env, not direct ${{ }} interpolation
          # into the script, to avoid shell injection.
          BRANCH: ${{ inputs.branch }}
        run: |
          SUFFIX=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          STACK="folio-${SUFFIX}"
          echo "stack-name=${STACK}" >> "$GITHUB_OUTPUT"
          echo "Cleaning up stack=${STACK}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: eu-central-1

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack \
            --stack-name "${{ steps.env.outputs.stack-name }}" \
            --region eu-central-1

          echo "Waiting for stack deletion..."
          aws cloudformation wait stack-delete-complete \
            --stack-name "${{ steps.env.outputs.stack-name }}" \
            --region eu-central-1
